name: Stable ARM64 validation

on:
  workflow_dispatch:
    inputs:
      existing_run_id:
        description: 'Run startup checks on an existing successful build without rebuilding'
        required: false
        default: ''
        type: string
  push:
    branches: [LastChat_dev]
    paths: [.github/workflows/stable-arm64-validation.yml]

permissions:
  contents: read
  actions: read

jobs:
  mode:
    runs-on: ubuntu-24.04
    outputs:
      existing_run_id: ${{ steps.mode.outputs.existing_run_id }}
    steps:
      - id: mode
        env:
          INPUT_RUN_ID: ${{ inputs.existing_run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PYMODE'
          import os, re
          run_id = os.environ.get('INPUT_RUN_ID', '').strip()
          match = re.search(r'\[reuse-build:(\d+)\]', os.environ.get('COMMIT_MESSAGE', ''))
          if not run_id and match:
              run_id = match.group(1)
          if run_id and not run_id.isdigit():
              raise SystemExit('existing_run_id must be a GitHub Actions run ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'existing_run_id={run_id}\n')
          PYMODE

  build:
    needs: mode
    if: needs.mode.outputs.existing_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install Android build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: stable-validation-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: stable-validation-${{ runner.os }}-
      - name: Configure stable build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = os.environ['GOOGLE_SERVICES_JSON'].strip()
          if config:
              json.loads(config)
              Path('app/google-services.json').write_text(config)
          # The delivery APK is re-signed with the supplied keystore after download.
          Path('ci-stable.init.gradle').write_text('''
          allprojects { project ->
              if (project.path == ':app') {
                  project.afterEvaluate {
                      android.testBuildType = 'release'
                      // Legacy window tests require debug-only lab Activities. The release
                      // instrumentation APK contains the backend ART regression suite.
                      android.sourceSets.androidTest.java.setSrcDirs(['src/androidTest/java/me/rerere/rikkahub/data/ai'])
                      android.defaultConfig.ndk.abiFilters.clear()
                      android.splits.abi.reset()
                      android.splits.abi.include('arm64-v8a', 'x86_64')
                      android.splits.abi.universalApk = false
                  }
              }
          }
          ''')
          PY
      - name: Install and check web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run typecheck
      - name: Install ARMHF smoke-test emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          curl --fail --location --retry 3 https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/armv7/alpine-minirootfs-3.19.9-armv7.tar.gz -o "$RUNNER_TEMP/alpine-armv7.tar.gz"
      - name: Run feature and persistence regression tests
        env:
          LASTCHAT_ARMHF_ARCHIVE: ${{ runner.temp }}/alpine-armv7.tar.gz
          LASTCHAT_QEMU_ARM: /usr/bin/qemu-arm
        run: |
          chmod +x gradlew
          ./gradlew :workspace:testDebugUnitTest --tests '*Rootfs*Test' \
            :app:testStableDebugUnitTest \
            --tests '*GenerationHandlerSkillToolTest' --tests '*AdditionalContextTest' \
            --tests '*SettingsStoreDurabilityTest' --tests '*SettingsMergeTest' \
            --tests '*SkillExportImportTest' --tests '*PhoneUseContinuationTest' \
            --tests '*AvatarSerializationTest' --tests '*StartupDependenciesTest' \
            --tests '*AddonComposerUiTest' --tests '*QuestionnaireMotionTest' \
            --tests '*PromptPlaceholdersTest' --tests '*PromptHistoryBoundaryTest' \
            --tests '*AssistantInitialMessagesTest' --tests '*ChatGenerationTransformersTest' \
            --tests '*AddonPagerLayoutTest' --tests '*OneUITopAppBarTest' \
            --tests '*DebouncedTextFieldPresentationTest' --tests '*SkillEditPersistenceTest' \
            --tests '*WidgetReliabilityTest' --tests '*WidgetAvatarRendererTest' \
            --tests '*SkillActivationResumeTest' --tests '*LorebookEntryEditorTest' \
            -Dlastchat.renderDir="$GITHUB_WORKSPACE/app/build/reports/addon-ui" \
            --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Build stable release APKs
        run: |
          ./gradlew -I ci-stable.init.gradle :app:assembleStableRelease :app:assembleStableReleaseAndroidTest \
            --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        with:
          name: stable-arm64-release
          path: app/build/outputs/apk/**/*stable-arm64-v8a-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-x86-startup
          path: app/build/outputs/apk/**/*stable-x86_64-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-backend-tests
          path: app/build/outputs/apk/androidTest/stable/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addon-ui-renders
          path: app/build/reports/addon-ui/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            workspace/build/test-results/
          if-no-files-found: ignore

  startup:
    needs: [mode, build]
    if: always() && needs.mode.result == 'success' && (needs.build.result == 'success' || needs.mode.outputs.existing_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stable-x86-startup
          path: startup-apk
          run-id: ${{ needs.mode.outputs.existing_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: stable-backend-tests
          path: backend-test-apk
          run-id: ${{ needs.mode.outputs.existing_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: sudo chmod a+rw /dev/kvm
      - name: Verify stable release startup and Android backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/ci/check-release-startup.sh startup-apk stable
            bash tools/ci/check-release-backend.sh backend-test-apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-startup-evidence
          path: startup-smoke-logs/
          if-no-files-found: ignore
