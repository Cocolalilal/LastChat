name: Build Debug APK

on:
  push:
    branches:
      - feat/memory-summary
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          npm ci || (bun install && pnpm install)

      - name: Mock google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "lastchat-mock",
              "storage_bucket": "lastchat-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "lastchat.rikkafork.velvet"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock_api_key"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "lastchat.rikkafork.velvet.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock_api_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using secure repository secret keystore"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "No secret found, generating ephemeral fallback keystore"
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          free -h
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug -Plastchat.abi.splits=true --no-parallel --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lastchat-dev-debug-arm64-v8a
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          retention-days: 7
