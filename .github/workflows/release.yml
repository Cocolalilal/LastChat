name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          if os.environ['KEY_BASE64'].strip() and os.environ['SIGNING_CONFIG'].strip():
              Path('app/app.key').write_bytes(base64.b64decode(os.environ['KEY_BASE64'], validate=True))
              Path('local.properties').write_text(os.environ['SIGNING_CONFIG'])
              print('Release signing configuration prepared.')
          else:
              print('::warning::Release signing secrets are absent; using the Gradle debug-signing fallback.')

          config = os.environ['GOOGLE_SERVICES_JSON'].strip()
          if config:
              json.loads(config)
              Path('app/google-services.json').write_text(config)
              print('Firebase configuration prepared.')
          else:
              print('::warning::Firebase configuration is absent; building without Firebase integration.')
          PY

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/**/*.apk
