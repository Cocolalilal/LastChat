name: Release Build

on:
  workflow_dispatch:
    inputs:
      existing_run_id:
        description: 'Export ARM64 APKs from an existing successful release run (skip rebuilding)'
        required: false
        default: ''
        type: string

jobs:
  build:
    if: inputs.existing_run_id == ''
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          if os.environ['KEY_BASE64'].strip() and os.environ['SIGNING_CONFIG'].strip():
              Path('app/app.key').write_bytes(base64.b64decode(os.environ['KEY_BASE64'], validate=True))
              Path('local.properties').write_text(os.environ['SIGNING_CONFIG'])
              print('Release signing configuration prepared.')
          else:
              print('::warning::Release signing secrets are absent; using the Gradle debug-signing fallback.')

          config = os.environ['GOOGLE_SERVICES_JSON'].strip()
          if config:
              json.loads(config)
              Path('app/google-services.json').write_text(config)
              print('Firebase configuration prepared.')
          else:
              print('::warning::Firebase configuration is absent; building without Firebase integration.')
          PY

      - name: Gradle Build
        run: |
          chmod +x gradlew
          # Keep Kotlin compilation and Gradle in one bounded JVM on the runner.
          ./gradlew assembleRelease --no-parallel --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/**/*.apk

      - name: Upload ARM64 APKs separately
        uses: actions/upload-artifact@v4
        with:
          name: arm64-release-apks
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error

  export-arm64:
    if: inputs.existing_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download existing release APKs
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          run-id: ${{ inputs.existing_run_id }}
          github-token: ${{ github.token }}
          path: release-apks

      - name: Upload ARM64 APKs separately
        uses: actions/upload-artifact@v4
        with:
          name: arm64-release-apks
          path: release-apks/**/*arm64-v8a*.apk
          if-no-files-found: error

  startup-smoke:
    if: inputs.existing_run_id == ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: release-apks
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Launch both release APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/check-release-startup.sh release-apks
      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-logs
          path: startup-smoke-logs/
          if-no-files-found: ignore
